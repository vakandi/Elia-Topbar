        - 'heading "Report SMM panel: frequently asked questions" [level=2] [ref=f14e403]'
        - heading "How much does a Report SMM panel cost?" [level=3] [ref=f14e404]
        - paragraph [ref=f14e405]: We list 41 Report services. Prices run from $2.376 to $285.12 per 1000, and the rate you see is the rate you are charged - there is no separate checkout markup. There is no subscription and no minimum monthly spend.
        - heading "What is the smallest Report order I can place?" [level=3] [ref=f14e406]
        - paragraph [ref=f14e407]: The smallest order across our Report catalogue is 10 units. Each service sets its own minimum and maximum, both shown next to it on the price list, because they come from what the supplier behind that service accepts.
        - heading "How fast are Report orders delivered?" [level=3] [ref=f14e408]
        - paragraph [ref=f14e409]: "Delivery speed is published per service rather than promised as one number: 25 of our 41 Report services currently carry a live delivery figure taken from the supplier behind them. Services without one are left blank rather than given an invented estimate."
        - heading "Do Report services come with a refill guarantee?" [level=3] [ref=f14e410]
        - paragraph [ref=f14e411]: None of our 41 Report services currently carry a refill guarantee. When a supplier offers one we write the term into the service name, so its absence here is the accurate state rather than an omission.
        - heading "Which Report service is cheapest?" [level=3] [ref=f14e412]
        - paragraph [ref=f14e413]: YouTube Report Spam Account | Max 1M | No Refill, at $2.376 per 1000 with a minimum order of 100 units. It is the lowest rate in our Report section; the most expensive line there runs $285.12 per 1000, and the gap is what you are paying for in account quality, refill cover and delivery speed rather than a different headline number.
        - heading "Which Report service is measured fastest?" [level=3] [ref=f14e414]
        - paragraph [ref=f14e415]: TikTok Report Spam Video | Max 3M | No Refill, which the supplier behind it reports at 1 hour 37 minutes. That figure comes from the supplier's own statistics rather than a promise in the description, and it is refreshed every four minutes. Services that report a live rate instead of a finish time are not ranked here, because a speed and a completion time are not the same measurement.
        - heading "Can I order Report services through an API?" [level=3] [ref=f14e416]
        - paragraph [ref=f14e417]: Yes. The same 41 Report services are available through our API, which follows the standard SMM panel API v2 specification. If your panel already talks to other providers it will talk to ours without code changes.
