      - heading "Refill guarantees on Report" [level=2] [ref=f14e387]
      - paragraph [ref=f14e388]:
        - strong [ref=f14e389]: None of our 41 Report services carry a refill guarantee.
        - text: No supplier behind them offers one for Report, so we do not advertise one. If that changes we write the term into the service name; its absence here is the accurate state, not an omission.
      - heading "Why Report prices range from $2.376 to $285.12" [level=2] [ref=f14e390]
      - paragraph [ref=f14e391]:
        - text: Price is not a quality scale you can read off on its own. At the bottom is
        - emphasis [ref=f14e392]: YouTube Report Spam Account | Max 1M | No Refill
        - text: at $2.376 per 1000; at the top,
        - emphasis [ref=f14e393]: Application Reports | Max 5K | No Refill
        - text: "at $285.12. They are not the same product at different prices — what moves the number is what the service does: country or language targeting, the refill term, order limits and the source behind it. A dearer service is not automatically better for your case; it is usually more specific."
